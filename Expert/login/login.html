    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="blogin">Login</button>
            <p><a href="#" id="forgotPasswordLink">Forgot Password?</a></p>
        </form>

    <!-- <footer id="footer"></footer> -->

    <script>
        
        
        document.addEventListener('DOMContentLoaded', function() {
            loadFooter();
        });
    
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
    
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
    
            if (username && password) {
                // طلب بيانات تسجيل الدخول من API
                axios.post('https://elmofakir.test/api/login-info',username,password)
                    .then(response => {
                        const userInfo = response.data;
    
                        // التحقق من المطابقة
                        if (username === userInfo.username && password === userInfo.password) {
                            alert("Login successful!");
                            window.location.href = "/components/secend-page/expert.html"; // نقل إلى صفحة الأكسبرت
                        } else {
                            alert("Incorrect username or password. Please try again.");
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching login info:', error);
                        alert("An error occurred. Please try again later.");
                    });
            } else {
                alert("Please enter both username and password.");
            }
        });
    
        document.getElementById('forgotPasswordLink').addEventListener('click', function(event) {
            event.preventDefault();
            alert("Forgot Password? Check your email for reset instructions.");
        });
